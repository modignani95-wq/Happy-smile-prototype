<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappySmile Dental Clinic</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <!-- React 18 & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb', // Clean dental blue
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initial inquiries in the Receptionist queue
    const INITIAL_INQUIRIES = [
      {
        id: "HS-8488",
        name: "Marcus Vance",
        phone: "+1 (555) 349-8120",
        service: "Routine Teeth Cleaning & Polish",
        category: "cleaning",
        tier: "bucket_a",
        tierLabel: "Same-Day / Routine",
        preferredTime: "Today (3:00 PM)",
        symptoms: "Routine 6-month checkup, mild plaque behind lower incisors.",
        aiSummary: "Low complexity (35 min chair). No active pain. Fast-track approved.",
        submittedAgo: "8 mins ago",
        status: "Auto-Slotted",
        assignedStaff: "Lisa Chen (Hygienist)",
        isNew: false
      },
      {
        id: "HS-8485",
        name: "Elena Rostova",
        phone: "+1 (555) 782-9941",
        service: "Single Dental Implant Consult",
        category: "implant",
        tier: "bucket_b",
        tierLabel: "Specialist Consult",
        preferredTime: "Flexible this week",
        symptoms: "Missing lower right first molar extracted 5 months ago. Needs 3D CBCT scan.",
        aiSummary: "High complexity (Implantology). Missing tooth #46. Requires diagnostic scan.",
        submittedAgo: "22 mins ago",
        status: "Callback Needed",
        assignedStaff: "Dr. Gregory Mitchell (Implantologist)",
        isNew: false
      },
      {
        id: "HS-8481",
        name: "David Kim",
        phone: "+1 (555) 612-4093",
        service: "Professional Laser Teeth Whitening",
        category: "whitening",
        tier: "bucket_a",
        tierLabel: "Same-Day / Routine",
        preferredTime: "Tomorrow (11:00 AM)",
        symptoms: "Upcoming wedding event in 10 days. Looking for 3-4 shades lighter.",
        aiSummary: "Low complexity (60 min cosmetic). Cold sensitivity checked (none).",
        submittedAgo: "45 mins ago",
        status: "Confirmed",
        assignedStaff: "Dr. Sarah Jenkins",
        isNew: false
      },
      {
        id: "HS-8477",
        name: "Jessica Patel",
        phone: "+1 (555) 420-1892",
        service: "Clear Aligners / Orthodontic Consult",
        category: "braces",
        tier: "bucket_b",
        tierLabel: "Specialist Consult",
        preferredTime: "Saturday Morning",
        symptoms: "Moderate crowding of lower front teeth, slight bite misalignment.",
        aiSummary: "Medium-High complexity (Orthodontic). Prefers invisible aligners.",
        submittedAgo: "1 hour ago",
        status: "Callback Scheduled",
        assignedStaff: "Dr. Aris Thorne (Orthodontist)",
        isNew: false
      }
    ];

    function App() {
      // ONLY TWO SCREENS: 'patient' (default) and 'receptionist'
      const [currentScreen, setCurrentScreen] = useState('patient');
      
      // Inquiries queue
      const [inquiries, setInquiries] = useState(INITIAL_INQUIRIES);
      const [filterCategory, setFilterCategory] = useState('all');
      
      // Patient Form fields
      const [patientName, setPatientName] = useState("");
      const [patientPhone, setPatientPhone] = useState("");
      const [patientService, setPatientService] = useState("Teeth Cleaning & Polish");
      const [patientCategory, setPatientCategory] = useState("cleaning");
      const [patientTime, setPatientTime] = useState("Today - Afternoon (2:00 PM - 5:00 PM)");
      const [patientNotes, setPatientNotes] = useState("");
      
      // Patient submission progress
      const [submissionStage, setSubmissionStage] = useState('idle'); // 'idle' | 'submitting' | 'screening_call' | 'submitted'
      const [currentInquiryData, setCurrentInquiryData] = useState(null);
      const [screeningStep, setScreeningStep] = useState(0);
      const [screeningAnswers, setScreeningAnswers] = useState({});
      
      // Detail modal for receptionist
      const [selectedInquiry, setSelectedInquiry] = useState(null);
      const [actionToast, setActionToast] = useState("");

      const showToast = (msg) => {
        setActionToast(msg);
        setTimeout(() => setActionToast(""), 3500);
      };

      // Quick presets to fill patient form
      const applyPreset = (type) => {
        if (type === 'cleaning') {
          setPatientName("Sarah Jenkins");
          setPatientPhone("+1 (555) 234-8971");
          setPatientService("Teeth Cleaning & Polish");
          setPatientCategory("cleaning");
          setPatientTime("Today - Afternoon (3:30 PM)");
          setPatientNotes("Routine dental cleaning, no sharp pain, slight sensitivity to cold drinks.");
        } else if (type === 'implant') {
          setPatientName("James Morrison");
          setPatientPhone("+1 (555) 891-4432");
          setPatientService("Dental Implant Consultation");
          setPatientCategory("implant");
          setPatientTime("Tomorrow - Morning (10:00 AM)");
          setPatientNotes("Lost one lower back molar 6 months ago. Want to know eligibility and pricing.");
        } else if (type === 'whitening') {
          setPatientName("Chloe Dupuis");
          setPatientPhone("+1 (555) 543-7721");
          setPatientService("Teeth Whitening");
          setPatientCategory("whitening");
          setPatientTime("Today - Evening (5:00 PM)");
          setPatientNotes("Need in-office laser whitening before an upcoming wedding event.");
        } else if (type === 'braces') {
          setPatientName("Aiden Brooks");
          setPatientPhone("+1 (555) 912-3884");
          setPatientService("Clear Aligners & Braces");
          setPatientCategory("braces");
          setPatientTime("Saturday - Any time");
          setPatientNotes("Interested in clear invisible aligners for overlapping upper front teeth.");
        }
      };

      // Screening questions
      const screeningQuestions = {
        cleaning: [
          {
            q: "How long has it been since your last dental cleaning or checkup?",
            options: ["Within 6 months", "6 to 12 months ago", "More than 1 year ago"]
          },
          {
            q: "Are you currently experiencing any tooth pain, bleeding gums, or swelling?",
            options: ["No pain, just regular hygiene check", "Mild bleeding while flossing", "Yes, active sensitivity"]
          }
        ],
        whitening: [
          {
            q: "Have you ever experienced severe tooth sensitivity to hot or cold foods?",
            options: ["Never / Very mild", "Occasionally sensitive", "Very sensitive teeth"]
          },
          {
            q: "When is your target event or preferred completion date?",
            options: ["Today or Tomorrow", "Within 1 week", "Within 1 month"]
          }
        ],
        implant: [
          {
            q: "How many teeth need replacement and how long have they been missing?",
            options: ["1 tooth (lost within 6 months)", "1-2 teeth (lost over a year ago)", "Multiple teeth / full arch"]
          },
          {
            q: "Do you already have a recent dental X-ray or 3D CT scan?",
            options: ["No, need full scan at HappySmile", "Yes, have recent digital X-ray", "Unsure"]
          }
        ],
        braces: [
          {
            q: "What is your primary orthodontic concern?",
            options: ["Crooked or crowded teeth", "Gaps between teeth", "Overbite / Underbite alignment"]
          },
          {
            q: "Which treatment method do you strongly prefer?",
            options: ["Invisible Clear Aligners", "Traditional Ceramic Braces", "Doctor recommendation"]
          }
        ]
      };

      const handleFormSubmit = (e) => {
        if (e) e.preventDefault();
        if (!patientName.trim() || !patientPhone.trim()) {
          alert("Please fill in your Name and Phone Number so HappySmile can contact you.");
          return;
        }

        setSubmissionStage('submitting');
        
        const isRoutine = patientCategory === 'cleaning' || patientCategory === 'whitening';
        const tier = isRoutine ? 'bucket_a' : 'bucket_b';
        const tierLabel = isRoutine ? 'Same-Day / Routine' : 'Specialist Consult';

        const newId = `HS-${Math.floor(1000 + Math.random() * 9000)}`;
        const submission = {
          id: newId,
          name: patientName,
          phone: patientPhone,
          service: patientService,
          category: patientCategory,
          tier: tier,
          tierLabel: tierLabel,
          preferredTime: patientTime,
          symptoms: patientNotes || "No additional notes provided.",
          aiSummary: isRoutine 
            ? `Low complexity (${patientCategory === 'cleaning' ? '35 min hygiene' : '60 min cosmetic'}). Fast-track slot held.`
            : `High complexity (${patientCategory === 'implant' ? 'Implantology' : 'Orthodontics'}). Diagnostic consult & scan scheduled.`,
          submittedAgo: "Just now",
          status: isRoutine ? "Auto-Slotted" : "Priority Callback Queue",
          assignedStaff: isRoutine ? "Front Desk Coordinator" : "Clinical Care Director",
          isNew: true
        };

        setCurrentInquiryData(submission);

        // Transition to screening question modal after brief pause
        setTimeout(() => {
          setSubmissionStage('screening_call');
          setScreeningStep(0);
        }, 700);
      };

      const handleScreeningAnswer = (answer) => {
        const currentQ = screeningQuestions[patientCategory] || screeningQuestions.cleaning;
        const nextStep = screeningStep + 1;
        setScreeningAnswers({ ...screeningAnswers, [screeningStep]: answer });

        if (nextStep < currentQ.length) {
          setScreeningStep(nextStep);
        } else {
          // Completed screening!
          // 1. Add to inquiries
          setInquiries(prev => [currentInquiryData, ...prev]);
          setSubmissionStage('submitted');
          
          showToast(`Form submitted! Switching to Receptionist Side to see incoming request...`);

          // 2. Automatically navigate to Receptionist Side after 1.2s so the receptionist sees it!
          setTimeout(() => {
            setCurrentScreen('receptionist');
            // reset patient form state for next round
            setSubmissionStage('idle');
            setPatientName("");
            setPatientPhone("");
            setPatientNotes("");
          }, 1200);
        }
      };

      const handleResetDemo = () => {
        setInquiries(INITIAL_INQUIRIES);
        setSubmissionStage('idle');
        setPatientName("");
        setPatientPhone("");
        setPatientNotes("");
        setSelectedInquiry(null);
        setCurrentScreen('patient');
        showToast("Demo reset to default state.");
      };

      // Filter inquiries
      const filteredInquiries = inquiries.filter(item => {
        if (filterCategory === 'all') return true;
        if (filterCategory === 'bucket_a') return item.tier === 'bucket_a';
        if (filterCategory === 'bucket_b') return item.tier === 'bucket_b';
        return true;
      });

      const countTotal = inquiries.length;
      const countBucketA = inquiries.filter(i => i.tier === 'bucket_a').length;
      const countBucketB = inquiries.filter(i => i.tier === 'bucket_b').length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* TOP GLOBAL BAR */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-xs">
            <div className="max-w-6xl mx-auto px-4 sm:px-6">
              <div className="flex items-center justify-between h-16">
                
                {/* Brand & Clinic Identity */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-sm">
                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                      <path d="M12 2C8.5 2 6 4.5 6 7.5c0 2 .8 3.8 2 5.1V19c0 1.7 1.3 3 3 3 .8 0 1.5-.3 2-1 .5.7 1.2 1 2 1 1.7 0 3-1.3 3-3v-6.4c1.2-1.3 2-3.1 2-5.1C20 4.5 17.5 2 12 2zm-2 17c-.6 0-1-.4-1-1v-4.5c.6.3 1.3.5 2 .5s1.4-.2 2-.5V18c0 .6-.4 1-1 1s-1-.4-1-1v-2h-1v2c0 .6-.4 1-1 1z"/>
                    </svg>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="font-heading font-bold text-xl tracking-tight text-blue-900">HappySmile</span>
                      <span className="text-xs font-semibold px-2 py-0.5 rounded-md bg-blue-100 text-blue-800">Dental Clinic</span>
                    </div>
                  </div>
                </div>

                {/* EXACTLY TWO SCREENS IN NAVIGATION */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                  <button 
                    onClick={() => setCurrentScreen('patient')}
                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                      currentScreen === 'patient' 
                        ? 'bg-blue-600 text-white shadow-xs' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>Patient's Side</span>
                  </button>

                  <button 
                    onClick={() => setCurrentScreen('receptionist')}
                    className={`flex items-center space-x-2 px-4 py-2 rounded-lg text-sm font-semibold transition-all ${
                      currentScreen === 'receptionist' 
                        ? 'bg-blue-600 text-white shadow-xs' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span>Receptionist's Side</span>
                    {inquiries.some(i => i.isNew) && (
                      <span className="w-2 h-2 rounded-full bg-blue-400"></span>
                    )}
                  </button>
                </div>

                {/* Reset button */}
                <div className="flex items-center space-x-2">
                  <button 
                    onClick={handleResetDemo}
                    className="text-xs text-slate-600 hover:text-blue-700 bg-slate-100 hover:bg-blue-50 px-3 py-1.5 rounded-lg border border-slate-200 font-medium transition-colors"
                  >
                    ↺ Reset Demo
                  </button>
                </div>

              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {actionToast && (
            <div className="fixed bottom-6 right-6 z-50 bg-blue-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-3 border border-blue-700">
              <svg className="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
              </svg>
              <span className="text-sm font-medium">{actionToast}</span>
            </div>
          )}

          {/* MAIN VIEW CONTENT */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            
            {/* ============================================================ */}
            {/* SCREEN 1: PATIENT'S SIDE                                      */}
            {/* ============================================================ */}
            {currentScreen === 'patient' && (
              <div className="max-w-3xl mx-auto space-y-6">
                
                {/* Screen Header Badge */}
                <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                  <div>
                    <h1 className="text-xl font-heading font-bold text-slate-900">Patient's Side</h1>
                    <p className="text-xs text-slate-500">Experience the dental website as a patient requesting an appointment.</p>
                  </div>
                  <div className="text-xs bg-blue-50 text-blue-700 font-semibold px-3 py-1 rounded-full border border-blue-200">
                    Step 1: Fill Form & Submit
                  </div>
                </div>

                {/* Dental Website Card */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                  
                  {/* Top phone & hours bar */}
                  <div className="border-b border-slate-100 px-6 py-3 bg-slate-50 flex items-center justify-between text-xs text-slate-600">
                    <div className="flex items-center space-x-3">
                      <span className="font-semibold text-blue-800">📞 (555) 321-SMILE</span>
                      <span>•</span>
                      <span>Mon - Sat: 8:00 AM - 7:00 PM</span>
                    </div>
                    <span className="text-emerald-700 font-medium">● Accepting New Patients</span>
                  </div>

                  {/* Dental Hero */}
                  <div className="p-6 bg-gradient-to-b from-blue-50/70 via-white to-white border-b border-slate-100">
                    <div className="inline-block px-2.5 py-0.5 rounded-full bg-blue-100 text-blue-800 text-xs font-semibold mb-2">
                      ⭐ 4.9 Rating (1,240+ Verified Reviews)
                    </div>
                    <h2 className="font-heading font-extrabold text-2xl text-slate-900 tracking-tight">
                      Gentle, Modern Dental Care
                    </h2>
                    <p className="text-sm text-slate-600 mt-1">
                      Same-day emergency visits, gentle cleanings, painless cosmetic whitening, and advanced 3D implantology.
                    </p>

                    {/* Quick Treatment Selector */}
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4">
                      <div 
                        onClick={() => { setPatientCategory('cleaning'); setPatientService('Teeth Cleaning & Polish'); }}
                        className={`p-3 rounded-xl border text-center cursor-pointer transition-colors ${
                          patientCategory === 'cleaning' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 font-semibold' 
                            : 'border-slate-200 bg-white hover:border-blue-200'
                        }`}
                      >
                        <div className="text-base">🪥</div>
                        <div className="text-xs mt-1">Cleaning</div>
                      </div>

                      <div 
                        onClick={() => { setPatientCategory('whitening'); setPatientService('Teeth Whitening'); }}
                        className={`p-3 rounded-xl border text-center cursor-pointer transition-colors ${
                          patientCategory === 'whitening' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 font-semibold' 
                            : 'border-slate-200 bg-white hover:border-blue-200'
                        }`}
                      >
                        <div className="text-base">✨</div>
                        <div className="text-xs mt-1">Whitening</div>
                      </div>

                      <div 
                        onClick={() => { setPatientCategory('implant'); setPatientService('Dental Implant Consultation'); }}
                        className={`p-3 rounded-xl border text-center cursor-pointer transition-colors ${
                          patientCategory === 'implant' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 font-semibold' 
                            : 'border-slate-200 bg-white hover:border-blue-200'
                        }`}
                      >
                        <div className="text-base">🦷</div>
                        <div className="text-xs mt-1">Implants</div>
                      </div>

                      <div 
                        onClick={() => { setPatientCategory('braces'); setPatientService('Clear Aligners & Braces'); }}
                        className={`p-3 rounded-xl border text-center cursor-pointer transition-colors ${
                          patientCategory === 'braces' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 font-semibold' 
                            : 'border-slate-200 bg-white hover:border-blue-200'
                        }`}
                      >
                        <div className="text-base">😁</div>
                        <div className="text-xs mt-1">Aligners</div>
                      </div>
                    </div>
                  </div>

                  {/* One-click presets */}
                  <div className="px-6 py-2.5 bg-blue-50/60 border-b border-blue-100 flex items-center justify-between flex-wrap gap-2 text-xs">
                    <span className="font-semibold text-blue-900">⚡ Autofill Sample Patient:</span>
                    <div className="flex flex-wrap gap-1.5">
                      <button 
                        type="button"
                        onClick={() => applyPreset('cleaning')}
                        className="bg-white hover:bg-blue-100 text-blue-800 font-medium px-2.5 py-1 rounded-md border border-blue-200 transition-colors"
                      >
                        Sarah (Cleaning)
                      </button>
                      <button 
                        type="button"
                        onClick={() => applyPreset('implant')}
                        className="bg-white hover:bg-amber-100 text-amber-900 font-medium px-2.5 py-1 rounded-md border border-amber-200 transition-colors"
                      >
                        James (Implant)
                      </button>
                      <button 
                        type="button"
                        onClick={() => applyPreset('whitening')}
                        className="bg-white hover:bg-blue-100 text-blue-800 font-medium px-2.5 py-1 rounded-md border border-blue-200 transition-colors"
                      >
                        Chloe (Whitening)
                      </button>
                      <button 
                        type="button"
                        onClick={() => applyPreset('braces')}
                        className="bg-white hover:bg-purple-100 text-purple-900 font-medium px-2.5 py-1 rounded-md border border-purple-200 transition-colors"
                      >
                        Aiden (Aligners)
                      </button>
                    </div>
                  </div>

                  {/* Patient Booking Form */}
                  <div className="p-6">
                    {submissionStage === 'idle' && (
                      <form onSubmit={handleFormSubmit} className="space-y-4">
                        <div className="border-b border-slate-100 pb-3">
                          <h3 className="font-heading font-bold text-base text-slate-900">
                            Book an Appointment / Request Contact
                          </h3>
                          <p className="text-xs text-slate-500 mt-0.5">
                            Submitting this form automatically triages your request and routes it to the receptionist.
                          </p>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Full Name <span className="text-red-500">*</span>
                            </label>
                            <input 
                              type="text"
                              required
                              value={patientName}
                              onChange={(e) => setPatientName(e.target.value)}
                              placeholder="e.g. Sarah Jenkins"
                              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            />
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Phone / WhatsApp Number <span className="text-red-500">*</span>
                            </label>
                            <input 
                              type="tel"
                              required
                              value={patientPhone}
                              onChange={(e) => setPatientPhone(e.target.value)}
                              placeholder="e.g. +1 (555) 234-8971"
                              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Service Needed
                            </label>
                            <select 
                              value={patientService}
                              onChange={(e) => {
                                setPatientService(e.target.value);
                                if (e.target.value.includes("Cleaning")) setPatientCategory("cleaning");
                                else if (e.target.value.includes("Whitening")) setPatientCategory("whitening");
                                else if (e.target.value.includes("Implant")) setPatientCategory("implant");
                                else if (e.target.value.includes("Aligner") || e.target.value.includes("Braces")) setPatientCategory("braces");
                              }}
                              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            >
                              <option value="Teeth Cleaning & Polish">Teeth Cleaning & Polish (Routine)</option>
                              <option value="Teeth Whitening">Teeth Whitening (In-Office Laser)</option>
                              <option value="Dental Implant Consultation">Dental Implant Consultation (Specialist)</option>
                              <option value="Clear Aligners & Braces">Clear Aligners & Braces (Orthodontics)</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-xs font-semibold text-slate-700 mb-1">
                              Preferred Contact Window
                            </label>
                            <select 
                              value={patientTime}
                              onChange={(e) => setPatientTime(e.target.value)}
                              className="w-full text-sm px-3.5 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                            >
                              <option value="Today - Afternoon (2:00 PM - 5:00 PM)">Today - Afternoon (2:00 PM - 5:00 PM)</option>
                              <option value="Tomorrow - Morning (9:00 AM - 12:00 PM)">Tomorrow - Morning (9:00 AM - 12:00 PM)</option>
                              <option value="Saturday - Weekend Appointment">Saturday - Weekend Appointment</option>
                              <option value="Urgent / Same-Day First Available">Urgent / Same-Day First Available</option>
                            </select>
                          </div>
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">
                            Dental Symptoms or Notes (Optional)
                          </label>
                          <textarea 
                            rows="2"
                            value={patientNotes}
                            onChange={(e) => setPatientNotes(e.target.value)}
                            placeholder="e.g. Any sensitivity, missing teeth, or specific doctor preferences..."
                            className="w-full text-sm px-3.5 py-2 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                          ></textarea>
                        </div>

                        <div className="pt-2">
                          <button 
                            type="submit"
                            className="w-full py-3.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm shadow-xs transition-colors flex items-center justify-center space-x-2"
                          >
                            <span>Submit Request & Check Availability</span>
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                            </svg>
                          </button>
                        </div>
                      </form>
                    )}

                    {/* Submission state */}
                    {submissionStage === 'submitting' && (
                      <div className="py-12 text-center space-y-3">
                        <div className="w-10 h-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto"></div>
                        <h4 className="font-heading font-bold text-slate-800 text-base">Receiving Request...</h4>
                        <p className="text-xs text-slate-500">Connecting to HappySmile Care Desk</p>
                      </div>
                    )}

                    {/* AI Screening Questions Modal */}
                    {submissionStage === 'screening_call' && (
                      <div className="bg-slate-900 text-white rounded-2xl p-5 shadow-lg space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                          <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 rounded-full bg-blue-600 flex items-center justify-center text-white">
                              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z" />
                              </svg>
                            </div>
                            <div>
                              <div className="text-[11px] font-semibold text-blue-400 uppercase tracking-wider">
                                Quick Clinical Screening
                              </div>
                              <h4 className="font-bold text-white text-sm">
                                HappySmile Care Coordinator for {patientName}
                              </h4>
                            </div>
                          </div>
                          <span className="text-xs px-2.5 py-1 rounded-full bg-emerald-950 text-emerald-400 border border-emerald-800">
                            Question {screeningStep + 1} of {(screeningQuestions[patientCategory] || screeningQuestions.cleaning).length}
                          </span>
                        </div>

                        <div className="bg-slate-800 p-4 rounded-xl space-y-3">
                          <p className="text-sm font-medium text-slate-100">
                            "{(screeningQuestions[patientCategory] || screeningQuestions.cleaning)[screeningStep]?.q}"
                          </p>

                          <div className="space-y-2 pt-1">
                            {(screeningQuestions[patientCategory] || screeningQuestions.cleaning)[screeningStep]?.options.map((opt, idx) => (
                              <button
                                key={idx}
                                onClick={() => handleScreeningAnswer(opt)}
                                className="w-full text-left text-xs sm:text-sm px-3.5 py-2.5 rounded-lg bg-slate-700 hover:bg-blue-600 text-slate-200 hover:text-white transition-colors flex items-center justify-between border border-slate-600"
                              >
                                <span>{opt}</span>
                                <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />
                                </svg>
                              </button>
                            ))}
                          </div>
                        </div>

                        <p className="text-center text-[11px] text-slate-400">
                          Clicking an option completes screening and automatically transitions to the Receptionist's Side.
                        </p>
                      </div>
                    )}

                    {/* Submitted state */}
                    {submissionStage === 'submitted' && (
                      <div className="py-10 text-center space-y-3">
                        <div className="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto">
                          <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
                          </svg>
                        </div>
                        <h4 className="font-heading font-bold text-slate-900 text-lg">Thank you! Request Confirmed.</h4>
                        <p className="text-sm text-slate-600">
                          Redirecting to the <strong>Receptionist's Side</strong> to show how HappySmile receives your request...
                        </p>
                      </div>
                    )}

                  </div>

                  <div className="bg-slate-50 p-4 border-t border-slate-200 text-center text-xs text-slate-500">
                    HappySmile Dental Clinic • 450 Medical Center Blvd • Emergency Care 24/7
                  </div>
                </div>

              </div>
            )}

            {/* ============================================================ */}
            {/* SCREEN 2: RECEPTIONIST'S SIDE                                 */}
            {/* ============================================================ */}
            {currentScreen === 'receptionist' && (
              <div className="space-y-6">
                
                {/* Screen Header Badge */}
                <div className="flex items-center justify-between border-b border-slate-200 pb-3 flex-wrap gap-2">
                  <div>
                    <h1 className="text-xl font-heading font-bold text-slate-900">Receptionist's Side</h1>
                    <p className="text-xs text-slate-500">What the clinic front desk sees after the patient asks to be contacted.</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => setCurrentScreen('patient')}
                      className="text-xs text-blue-700 bg-blue-50 hover:bg-blue-100 font-semibold px-3 py-1.5 rounded-lg border border-blue-200 transition-colors"
                    >
                      ← Back to Patient's Side
                    </button>
                  </div>
                </div>

                {/* Receptionist Stats Overview */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Total Inbound Requests</div>
                    <div className="text-2xl font-heading font-extrabold text-blue-900 mt-1">{countTotal}</div>
                    <div className="text-[11px] text-emerald-600 font-medium mt-1">● Synced in real-time</div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Bucket A (Same-Day / Routine)</div>
                    <div className="text-2xl font-heading font-extrabold text-emerald-700 mt-1">{countBucketA}</div>
                    <div className="text-[11px] text-slate-500 mt-1">Cleaning & Whitening</div>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                    <div className="text-xs font-semibold text-slate-500 uppercase">Bucket B (Specialist Queue)</div>
                    <div className="text-2xl font-heading font-extrabold text-amber-600 mt-1">{countBucketB}</div>
                    <div className="text-[11px] text-slate-500 mt-1">Implants & Orthodontics</div>
                  </div>
                </div>

                {/* Inquiries List Container */}
                <div className="bg-white rounded-2xl border border-slate-200 shadow-xs p-5 space-y-4">
                  
                  {/* Filter tabs */}
                  <div className="flex items-center justify-between flex-wrap gap-2 border-b border-slate-100 pb-3">
                    <div>
                      <h3 className="font-heading font-bold text-slate-900 text-sm">
                        Patient Inquiries Feed ({filteredInquiries.length})
                      </h3>
                      <p className="text-xs text-slate-500">
                        Review patient symptoms, AI triage summaries, and lock chair slots.
                      </p>
                    </div>

                    <div className="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg text-xs font-medium">
                      <button 
                        onClick={() => setFilterCategory('all')}
                        className={`px-3 py-1 rounded-md transition-colors ${
                          filterCategory === 'all' 
                            ? 'bg-white text-slate-900 font-bold shadow-xs' 
                            : 'text-slate-600 hover:text-slate-900'
                        }`}
                      >
                        All ({inquiries.length})
                      </button>
                      <button 
                        onClick={() => setFilterCategory('bucket_a')}
                        className={`px-3 py-1 rounded-md transition-colors ${
                          filterCategory === 'bucket_a' 
                            ? 'bg-emerald-600 text-white font-bold' 
                            : 'text-slate-600 hover:text-emerald-700'
                        }`}
                      >
                        Bucket A ({countBucketA})
                      </button>
                      <button 
                        onClick={() => setFilterCategory('bucket_b')}
                        className={`px-3 py-1 rounded-md transition-colors ${
                          filterCategory === 'bucket_b' 
                            ? 'bg-amber-600 text-white font-bold' 
                            : 'text-slate-600 hover:text-amber-700'
                        }`}
                      >
                        Bucket B ({countBucketB})
                      </button>
                    </div>
                  </div>

                  {/* Clean, Stable Cards with Smooth Hover (No scaling/jitter) */}
                  <div className="space-y-3">
                    {filteredInquiries.map((inq) => {
                      const isBucketA = inq.tier === 'bucket_a';
                      return (
                        <div 
                          key={inq.id}
                          className={`p-4 rounded-xl border transition-colors ${
                            inq.isNew 
                              ? 'bg-blue-50/70 border-blue-400 border-l-4 border-l-blue-600 shadow-xs' 
                              : 'bg-white border-slate-200 hover:border-slate-300'
                          }`}
                        >
                          {/* Card top row */}
                          <div className="flex items-start justify-between flex-wrap gap-2">
                            <div>
                              <div className="flex items-center space-x-2">
                                <span className="font-heading font-bold text-slate-900 text-base">
                                  {inq.name}
                                </span>
                                {inq.isNew && (
                                  <span className="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">
                                    NEW FROM PATIENT
                                  </span>
                                )}
                                <span className="text-xs font-mono text-slate-400">
                                  {inq.id}
                                </span>
                              </div>
                              <div className="text-xs text-slate-600 mt-0.5">
                                <span className="font-semibold text-blue-900">{inq.phone}</span>
                                <span className="mx-2">•</span>
                                <span>{inq.submittedAgo}</span>
                              </div>
                            </div>

                            <span className={`text-xs font-bold px-2.5 py-1 rounded-md ${
                              isBucketA 
                                ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' 
                                : 'bg-amber-100 text-amber-900 border border-amber-200'
                            }`}>
                              {isBucketA ? '🟢 Bucket A: Same-Day' : '🟡 Bucket B: Specialist'}
                            </span>
                          </div>

                          {/* Card details */}
                          <div className="mt-3 pt-2 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                            <div>
                              <span className="text-slate-400 text-[10px] uppercase font-semibold block">Requested Treatment</span>
                              <span className="font-semibold text-slate-800">{inq.service}</span>
                            </div>
                            <div>
                              <span className="text-slate-400 text-[10px] uppercase font-semibold block">Preferred Window</span>
                              <span className="text-slate-700">{inq.preferredTime}</span>
                            </div>
                          </div>

                          {/* AI Triage Summary Box */}
                          <div className="mt-3 p-3 rounded-lg bg-slate-50 border border-slate-200 text-xs">
                            <div className="flex items-center space-x-1.5 text-blue-900 font-semibold mb-1">
                              <svg className="w-3.5 h-3.5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                              </svg>
                              <span>AI Clinical Summary</span>
                            </div>
                            <p className="text-slate-700">{inq.aiSummary}</p>
                            {inq.symptoms && inq.symptoms !== "No additional notes provided." && (
                              <p className="text-slate-500 text-[11px] mt-1">
                                Patient notes: "{inq.symptoms}"
                              </p>
                            )}
                          </div>

                          {/* Action Buttons */}
                          <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
                            <span className="text-xs text-slate-500">
                              Assigned Staff: <strong className="text-slate-700">{inq.assignedStaff}</strong>
                            </span>

                            <div className="flex items-center space-x-2">
                              <button 
                                onClick={() => setSelectedInquiry(inq)}
                                className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition-colors"
                              >
                                View Details
                              </button>

                              <button 
                                onClick={() => showToast(`📞 Calling ${inq.name} (${inq.phone})...`)}
                                className="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg transition-colors flex items-center space-x-1"
                              >
                                <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                </svg>
                                <span>Call Patient</span>
                              </button>

                              <button 
                                onClick={() => showToast(`✅ Appointment confirmed and locked for ${inq.name}`)}
                                className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg transition-colors"
                              >
                                Confirm Slot
                              </button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>

                </div>

              </div>
            )}

            {/* DETAIL MODAL */}
            {selectedInquiry && (
              <div className="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-200 space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                      <span className="text-xs font-mono font-bold text-blue-600">{selectedInquiry.id}</span>
                      <h3 className="font-heading font-bold text-lg text-slate-900">{selectedInquiry.name}</h3>
                    </div>
                    <button 
                      onClick={() => setSelectedInquiry(null)}
                      className="text-slate-400 hover:text-slate-600 p-1 font-bold text-base"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <span className="font-semibold text-slate-500">Contact Number:</span>
                      <p className="text-sm font-bold text-slate-900">{selectedInquiry.phone}</p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">Treatment:</span>
                      <p className="text-sm text-slate-800 font-semibold">{selectedInquiry.service} ({selectedInquiry.tierLabel})</p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">Patient Notes:</span>
                      <p className="p-2.5 rounded-lg bg-slate-50 text-slate-700 border border-slate-200 mt-1">
                        {selectedInquiry.symptoms}
                      </p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">AI Clinical Summary:</span>
                      <p className="p-2.5 rounded-lg bg-blue-50 text-blue-950 border border-blue-200 mt-1">
                        {selectedInquiry.aiSummary}
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <div>
                        <span className="text-slate-500">Proposed Slot:</span>
                        <p className="font-semibold text-slate-800">{selectedInquiry.preferredTime}</p>
                      </div>
                      <div>
                        <span className="text-slate-500">Assigned Provider:</span>
                        <p className="font-semibold text-slate-800">{selectedInquiry.assignedStaff}</p>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
                    <button 
                      onClick={() => setSelectedInquiry(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      Close
                    </button>
                    <button 
                      onClick={() => {
                        showToast(`WhatsApp sent to ${selectedInquiry.name}`);
                        setSelectedInquiry(null);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700"
                    >
                      Send WhatsApp
                    </button>
                    <button 
                      onClick={() => {
                        showToast(`Call dispatched for ${selectedInquiry.name}`);
                        setSelectedInquiry(null);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700"
                    >
                      Call Now
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
