  <!-- Tailwind CSS CDN -->

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {

            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb', // Clean dental blue
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            dental: {
              cyan: '#0284c7',
              ice: '#f0f9ff',
              mint: '#10b981',
              amber: '#f59e0b',

          },

            heading: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],

  <style>

      color: #0f172a;

      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {

      50% { opacity: 0.85; transform: scale(1.02); }

      animation: pulse-subtle 2s infinite ease-in-out;

<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <script type="text/babel">

      {
        id: "HS-8485",
        name: "Elena Rostova",
        phone: "+1 (555) 782-9941",

        category: "implant",
        tier: "bucket_b",
        tierLabel: "Specialist / Multi-Visit",
        preferredTime: "Flexible this week",
        symptoms: "Missing lower right first molar extracted 5 months ago. Needs bone evaluation & 3D CBCT scan.",
        aiSummary: "High complexity (Implantology). Missing #46. Requires 45-min diagnostic scan & surgeon consult.",

        status: "Callback Needed",

        phone: "+1 (555) 612-4093",
        service: "Professional Laser Teeth Whitening",
        category: "whitening",
        tier: "bucket_a",
        tierLabel: "Same-Day / Routine",
        preferredTime: "Tomorrow Morning (11:00 AM)",
        symptoms: "Upcoming wedding event in 10 days. Looking for 3-4 shades lighter.",
        aiSummary: "Low complexity (60 min cosmetic). Checked for cold sensitivity (none reported).",
        submittedAgo: "45 mins ago",
        status: "Confirmed",
        statusColor: "emerald",
        assignedStaff: "Dr. Sarah Jenkins",
        isNew: false
      },
      {
        id: "HS-8477",
        name: "Jessica Patel",
        phone: "+1 (555) 420-1892",
        service: "Clear Aligners / Orthodontic Consult",
        category: "braces",
        tier: "bucket_b",
        tierLabel: "Specialist / Multi-Visit",
        preferredTime: "Weekend Saturday",
        symptoms: "Moderate crowding of lower front teeth, slight bite misalignment.",
        aiSummary: "Medium-High complexity (Orthodontic). Prefers invisible aligners over traditional brackets.",
        submittedAgo: "1 hour ago",
        status: "Callback Scheduled",
        statusColor: "amber",
        assignedStaff: "Dr. Aris Thorne (Orthodontist)",
        isNew: false
      }
    ];

    function App() {
      // Main navigation between views: 'split', 'patient', 'clinic'
      const [viewMode, setViewMode] = useState('split');
      
      // Clinic inquiries list
      const [inquiries, setInquiries] = useState(INITIAL_INQUIRIES);
      const [filterCategory, setFilterCategory] = useState('all');
      
      // Patient Contact Form state (Scenario #1)
      const [patientName, setPatientName] = useState("");
      const [patientPhone, setPatientPhone] = useState("");
      const [patientService, setPatientService] = useState("Teeth Cleaning & Polish");
      const [patientCategory, setPatientCategory] = useState("cleaning");
      const [patientTime, setPatientTime] = useState("Today - Afternoon (2:00 PM - 5:00 PM)");
      const [patientNotes, setPatientNotes] = useState("");
      
      // Submission flow state: 'idle' -> 'submitting' -> 'screening_call' -> 'confirmed'
      const [submissionStage, setSubmissionStage] = useState('idle');
      const [currentInquiryData, setCurrentInquiryData] = useState(null);
      const [screeningStep, setScreeningStep] = useState(0);
      const [screeningAnswers, setScreeningAnswers] = useState({});
      
      // Selected patient in clinic view for staff action drawer/modal
      const [selectedInquiry, setSelectedInquiry] = useState(null);
      const [actionToast, setActionToast] = useState("");

      const showToast = (msg) => {
        setActionToast(msg);
        setTimeout(() => setActionToast(""), 3500);
      };

      // Presets for quick demonstration
      const applyPreset = (type) => {
        if (type === 'cleaning') {
          setPatientName("Sarah Jenkins");
          setPatientPhone("+1 (555) 234-8971");
          setPatientService("Teeth Cleaning & Polish");
          setPatientCategory("cleaning");
          setPatientTime("Today - Afternoon (3:30 PM)");
          setPatientNotes("Routine dental cleaning, no sharp pain, slight sensitivity to cold drinks.");
        } else if (type === 'implant') {
          setPatientName("James Morrison");
          setPatientPhone("+1 (555) 891-4432");
          setPatientService("Dental Implant Consultation");
          setPatientCategory("implant");
          setPatientTime("Tomorrow - Morning (10:00 AM)");
          setPatientNotes("Lost one lower back molar 6 months ago. Want to know if I am eligible for an implant and pricing.");
        } else if (type === 'whitening') {
          setPatientName("Chloe Dupuis");
          setPatientPhone("+1 (555) 543-7721");
          setPatientService("Teeth Whitening");
          setPatientCategory("whitening");
          setPatientTime("Today - Evening (5:00 PM)");
          setPatientNotes("Need in-office laser whitening before an anniversary trip next week.");
        } else if (type === 'braces') {
          setPatientName("Aiden Brooks");
          setPatientPhone("+1 (555) 912-3884");
          setPatientService("Clear Aligners & Braces");
          setPatientCategory("braces");
          setPatientTime("Saturday - Any time");
          setPatientNotes("Interested in clear invisible aligners for overlapping upper front teeth.");
        }
      };

      // Clinical triage questions for the interactive screening simulation
      const screeningQuestions = {
        cleaning: [
          {
            q: "How long has it been since your last dental cleaning or checkup?",
            options: ["Within 6 months", "6 to 12 months ago", "More than 1 year ago"]
          },
          {
            q: "Are you currently experiencing any tooth pain, bleeding gums, or swelling?",
            options: ["No pain, just regular hygiene check", "Mild bleeding while flossing", "Yes, active sensitivity"]
          }
        ],
        whitening: [
          {
            q: "Have you ever experienced severe tooth sensitivity to hot or cold foods?",
            options: ["Never / Very mild", "Occasionally sensitive", "Very sensitive teeth"]
          },
          {
            q: "When is your target event or preferred completion date?",
            options: ["Today or Tomorrow", "Within 1 week", "Within 1 month"]
          }
        ],
        implant: [
          {
            q: "How many teeth need replacement and how long have they been missing?",
            options: ["1 tooth (lost within 6 months)", "1-2 teeth (lost over a year ago)", "Multiple teeth / full arch"]
          },
          {
            q: "Do you already have a recent dental X-ray or 3D CT scan from another clinic?",
            options: ["No, need full scan at HappySmile", "Yes, have recent digital X-ray", "Unsure"]
          }
        ],
        braces: [
          {
            q: "What is your primary orthodontic concern?",
            options: ["Crooked or crowded teeth", "Gaps between teeth", "Overbite / Underbite alignment"]
          },
          {
            q: "Which treatment method do you strongly prefer?",
            options: ["Invisible Clear Aligners", "Traditional Ceramic Braces", "Doctor recommendation"]
          }
        ]
      };

      const handleFormSubmit = (e) => {
        if (e) e.preventDefault();
        if (!patientName.trim() || !patientPhone.trim()) {
          alert("Please fill in your Name and Phone Number so HappySmile can contact you.");
          return;
        }

        setSubmissionStage('submitting');
        
        // Determine complexity tier
        const isRoutine = patientCategory === 'cleaning' || patientCategory === 'whitening';
        const tier = isRoutine ? 'bucket_a' : 'bucket_b';
        const tierLabel = isRoutine ? 'Same-Day / Routine' : 'Specialist / Multi-Visit';

        const newId = `HS-${Math.floor(1000 + Math.random() * 9000)}`;
        const submission = {
          id: newId,
          name: patientName,
          phone: patientPhone,
          service: patientService,
          category: patientCategory,
          tier: tier,
          tierLabel: tierLabel,
          preferredTime: patientTime,
          symptoms: patientNotes || "No additional notes provided.",
          aiSummary: isRoutine 
            ? `Low complexity (${patientCategory === 'cleaning' ? '40 min hygiene' : '60 min cosmetic'}). Fast-track eligible.`
            : `High complexity (${patientCategory === 'implant' ? 'Implantology' : 'Orthodontics'}). Diagnostic consult & scan required.`,
          submittedAgo: "Just now",
          status: isRoutine ? "Auto-Slotted" : "Priority Callback Queue",
          statusColor: isRoutine ? "emerald" : "amber",
          assignedStaff: isRoutine ? "Front Desk Coordinator" : "Clinical Care Director",
          isNew: true
        };

        setCurrentInquiryData(submission);

        // Transition to smart screening simulation after 800ms
        setTimeout(() => {
          setSubmissionStage('screening_call');
          setScreeningStep(0);
        }, 800);
      };

      const handleScreeningAnswer = (answer) => {
        const currentQ = screeningQuestions[patientCategory] || screeningQuestions.cleaning;
        const nextStep = screeningStep + 1;
        setScreeningAnswers({ ...screeningAnswers, [screeningStep]: answer });

        if (nextStep < currentQ.length) {
          setScreeningStep(nextStep);
        } else {
          // Finished screening questions! Now push to HappySmile clinic list in real-time
          setSubmissionStage('confirmed');
          setInquiries(prev => [currentInquiryData, ...prev]);
          showToast(`✨ Real-Time Sync: HappySmile Clinic Portal received new lead for ${currentInquiryData.name}!`);
        }
      };

      const handleResetDemo = () => {
        setInquiries(INITIAL_INQUIRIES);
        setSubmissionStage('idle');
        setPatientName("");
        setPatientPhone("");
        setPatientNotes("");
        setSelectedInquiry(null);
        showToast("Demo reset to default state.");
      };

      // Filter inquiries in clinic dashboard
      const filteredInquiries = inquiries.filter(item => {
        if (filterCategory === 'all') return true;
        if (filterCategory === 'bucket_a') return item.tier === 'bucket_a';
        if (filterCategory === 'bucket_b') return item.tier === 'bucket_b';
        return true;
      });

      const countTotal = inquiries.length;
      const countBucketA = inquiries.filter(i => i.tier === 'bucket_a').length;
      const countBucketB = inquiries.filter(i => i.tier === 'bucket_b').length;

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          
          {/* TOP GLOBAL BAR: BRAND, SCENARIO TABS, STATUS */}

            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                {/* Brand & Clinic Identity */}
                <div className="flex items-center space-x-3">
                  <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/20">
                    {/* Tooth / Smile SVG Icon */}
                    <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">

                    </svg>
                  </div>
                  <div>
                    <div className="flex items-center space-x-2">
                      <span className="font-heading font-bold text-xl tracking-tight text-blue-900">HappySmile</span>
                      <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-blue-100 text-blue-800">Dental Clinic</span>
                    </div>
                    <p className="text-xs text-slate-500 hidden sm:block">Modern Dental Care & Instant AI Triage</p>
                  </div>
                </div>

                {/* Scenario Navigation Controls */}
                <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs sm:text-sm font-medium">
                  <button 
                    onClick={() => setViewMode('split')}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg transition-all ${
                      viewMode === 'split' 
                        ? 'bg-blue-600 text-white font-semibold shadow-sm' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
                    </svg>
                    <span>Split View (Both)</span>
                  </button>

                  <button 
                    onClick={() => setViewMode('patient')}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg transition-all ${
                      viewMode === 'patient' 
                        ? 'bg-blue-600 text-white font-semibold shadow-sm' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span className="w-2 h-2 rounded-full bg-blue-400"></span>
                    <span>#1 - Patient Contact</span>
                  </button>

                  <button 
                    onClick={() => setViewMode('clinic')}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg transition-all ${
                      viewMode === 'clinic' 
                        ? 'bg-blue-600 text-white font-semibold shadow-sm' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <span className="w-2 h-2 rounded-full bg-emerald-400"></span>
                    <span>#2 - What HappySmile Sees</span>
                    {inquiries.some(i => i.isNew) && (
                      <span className="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                    )}

                </div>

                {/* Reset button & live sync indicator */}

                    <span className="relative flex h-2 w-2">

                    </span>
                    <span>No Login Required</span>

                  <button 
                    onClick={handleResetDemo}
                    title="Reset to default demo state"
                    className="text-xs text-slate-600 hover:text-blue-700 hover:bg-blue-50 px-2.5 py-1.5 rounded-lg border border-slate-200 font-medium transition-colors"
                  >
                    ↺ Reset Demo
                  </button>
                </div>

              </div>

          </header>

              <svg className="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
              </svg>
              <span className="text-sm font-medium">{actionToast}</span>

            {/* Split View (Side by Side) or Single View */}
            <div className={`grid gap-6 ${viewMode === 'split' ? 'lg:grid-cols-12' : 'grid-cols-1'}`}>
              
              {/* ============================================================ */}
              {/* SCENARIO #1: PATIENT CONTACT WEBSITE (Left Pane / Tab 1)     */}
              {/* ============================================================ */}
              {(viewMode === 'split' || viewMode === 'patient') && (
                <div className={`${viewMode === 'split' ? 'lg:col-span-6' : 'max-w-4xl mx-auto w-full'} flex flex-col space-y-5`}>
                  
                  {/* Scenario 1 Header Banner */}
                  <div className="bg-gradient-to-r from-blue-600 to-blue-700 text-white rounded-2xl p-4 shadow-sm flex items-center justify-between">
                    <div>
                      <div className="flex items-center space-x-2">
                        <span className="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-semibold uppercase tracking-wider">
                          Scenario #1
                        </span>
                        <h2 className="font-heading font-bold text-lg">The Moment a Person Asks to be Contacted</h2>
                      </div>
                      <p className="text-xs text-blue-100 mt-0.5">
                        Patient visits HappySmile's website & requests a callback / appointment.
                      </p>
                    </div>
                    <div className="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center">
                      <svg className="w-5 h-5 text-blue-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    </div>
                  </div>

                  {/* Standard Realistic Dental Clinic Website Container */}
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                    
                    {/* Website Header & Contact Bar */}
                    <div className="border-b border-slate-100 px-6 py-3.5 bg-slate-50/70 flex flex-wrap items-center justify-between gap-3 text-xs text-slate-600">
                      <div className="flex items-center space-x-4">
                        <span className="flex items-center space-x-1.5 font-medium text-blue-800">
                          <svg className="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                          </svg>
                          <span>(555) 321-SMILE</span>
                        </span>
                        <span className="hidden sm:inline-block text-slate-400">•</span>
                        <span className="hidden sm:flex items-center space-x-1 text-slate-600">
                          <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                          </svg>
                          <span>Mon - Sat: 8:00 AM - 7:00 PM</span>
                        </span>
                      </div>
                      <div className="flex items-center space-x-2 text-emerald-700 font-medium">
                        <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>Welcoming New Patients</span>
                      </div>
                    </div>

                    {/* Website Hero Banner */}
                    <div className="p-6 bg-gradient-to-b from-blue-50/70 via-white to-white border-b border-slate-100">
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-blue-100/80 text-blue-800 text-xs font-semibold mb-2">
                            <span>⭐ 4.9 Rating (1,240+ Verified Reviews)</span>
                          </div>
                          <h1 className="font-heading font-extrabold text-2xl text-slate-900 tracking-tight leading-tight">
                            Gentle, Modern Dental Care in Your Neighborhood
                          </h1>
                          <p className="text-sm text-slate-600 mt-1 max-w-md">
                            Same-day emergency relief, gentle cleanings, painless cosmetic whitening, and advanced 3D implantology.
                          </p>
                        </div>
                        {/* Tooth Graphic */}
                        <div className="hidden sm:flex w-14 h-14 rounded-2xl bg-blue-100 text-blue-600 items-center justify-center flex-shrink-0 shadow-inner">
                          <svg className="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2C8.5 2 6 4.5 6 7.5c0 2 .8 3.8 2 5.1V19c0 1.7 1.3 3 3 3 .8 0 1.5-.3 2-1 .5.7 1.2 1 2 1 1.7 0 3-1.3 3-3v-6.4c1.2-1.3 2-3.1 2-5.1C20 4.5 17.5 2 12 2z"/>
                          </svg>
                        </div>
                      </div>

                      {/* Quick Dental Services Chips */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 mt-4">
                        <div className={`p-2.5 rounded-xl border text-center transition-all cursor-pointer ${
                          patientCategory === 'cleaning' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 shadow-sm' 
                            : 'border-slate-200 bg-white hover:border-blue-300'
                        }`} onClick={() => { setPatientCategory('cleaning'); setPatientService('Teeth Cleaning & Polish'); }}>
                          <div className="text-base">🪥</div>
                          <div className="text-xs font-semibold mt-1">Cleaning</div>
                          <div className="text-[10px] text-slate-500">Same-Day Available</div>
                        </div>

                        <div className={`p-2.5 rounded-xl border text-center transition-all cursor-pointer ${
                          patientCategory === 'whitening' 
                            ? 'border-blue-600 bg-blue-50 text-blue-900 shadow-sm' 
                            : 'border-slate-200 bg-white hover:border-blue-300'

                                <span className="text-slate-400 text-[10px] uppercase font-semibold block">Requested Treatment</span>
                                <span className="font-semibold text-slate-800">{inq.service}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 text-[10px] uppercase font-semibold block">Requested Window</span>
                                <span className="text-slate-700">{inq.preferredTime}</span>
                              </div>
                            </div>

                            {/* AI Triage & Clinical Notes */}
                            <div className="mt-2.5 p-2.5 rounded-lg bg-slate-50 border border-slate-200/70 text-xs">
                              <div className="flex items-center space-x-1.5 text-blue-900 font-semibold mb-0.5">
                                <svg className="w-3.5 h-3.5 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                                  <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clipRule="evenodd" />
                                </svg>
                                <span>AI Clinical Triage Summary</span>
                              </div>
                              <p className="text-slate-600">{inq.aiSummary}</p>
                              {inq.symptoms && inq.symptoms !== "No additional notes provided." && (
                                <p className="text-slate-500 text-[11px] mt-1 italic">
                                  Patient note: "{inq.symptoms}"
                                </p>
                              )}
                            </div>

                            {/* Staff Action Buttons */}
                            <div className="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between flex-wrap gap-2">
                              <div className="text-[11px] text-slate-500">
                                Assigned: <strong className="text-slate-700">{inq.assignedStaff}</strong>
                              </div>

                              <div className="flex items-center space-x-2">
                                <button 
                                  onClick={() => {
                                    setSelectedInquiry(inq);
                                  }}
                                  className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-2.5 py-1.5 rounded-lg transition-colors"
                                >
                                  View Details
                                </button>

                                <button 
                                  onClick={() => {
                                    showToast(`📞 Dialing ${inq.name} (${inq.phone}) via HappySmile VoIP line...`);
                                  }}
                                  className="text-xs bg-blue-600 hover:bg-blue-700 text-white font-semibold px-3 py-1.5 rounded-lg shadow-2xs transition-colors flex items-center space-x-1"
                                >
                                  <svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                                  </svg>
                                  <span>Call Patient</span>
                                </button>

                                <button 
                                  onClick={() => {
                                    showToast(`✅ Locked chair slot & emailed confirmed ticket for ${inq.name}`);
                                  }}
                                  className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-3 py-1.5 rounded-lg shadow-2xs transition-colors"
                                >
                                  Confirm Slot
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                </div>
              )}

            </div>

            {/* DETAILS MODAL FOR CLINIC STAFF */}
            {selectedInquiry && (
              <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                    <div>
                      <span className="text-xs font-mono font-bold text-blue-600">{selectedInquiry.id}</span>
                      <h3 className="font-heading font-bold text-lg text-slate-900">{selectedInquiry.name}</h3>
                    </div>
                    <button 
                      onClick={() => setSelectedInquiry(null)}
                      className="text-slate-400 hover:text-slate-600 p-1"
                    >
                      ✕
                    </button>
                  </div>

                  <div className="space-y-3 text-xs">
                    <div>
                      <span className="font-semibold text-slate-500">Contact Number:</span>
                      <p className="text-sm font-bold text-slate-900">{selectedInquiry.phone}</p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">Treatment & Category:</span>
                      <p className="text-sm text-slate-800 font-semibold">{selectedInquiry.service} ({selectedInquiry.tierLabel})</p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">Patient Symptoms / Notes:</span>
                      <p className="p-2.5 rounded-lg bg-slate-50 text-slate-700 border border-slate-200 mt-1">
                        {selectedInquiry.symptoms}
                      </p>
                    </div>

                    <div>
                      <span className="font-semibold text-slate-500">AI Screening Summary:</span>
                      <p className="p-2.5 rounded-lg bg-blue-50 text-blue-950 border border-blue-200 mt-1">
                        {selectedInquiry.aiSummary}
                      </p>
                    </div>

                    <div className="grid grid-cols-2 gap-2 pt-2">
                      <div>
                        <span className="text-slate-500">Proposed Slot:</span>
                        <p className="font-semibold text-slate-800">{selectedInquiry.preferredTime}</p>
                      </div>
                      <div>
                        <span className="text-slate-500">Assigned Provider:</span>
                        <p className="font-semibold text-slate-800">{selectedInquiry.assignedStaff}</p>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-100 flex items-center justify-end space-x-2">
                    <button 
                      onClick={() => setSelectedInquiry(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100"
                    >
                      Close
                    </button>
                    <button 
                      onClick={() => {
                        showToast(`WhatsApp sent to ${selectedInquiry.name}`);
                        setSelectedInquiry(null);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white hover:bg-emerald-700"
                    >
                      Send WhatsApp
                    </button>
                    <button 
                      onClick={() => {
                        showToast(`Call dispatched for ${selectedInquiry.name}`);
                        setSelectedInquiry(null);
                      }}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700"
                    >
                      Call Now
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
